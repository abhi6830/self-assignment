<!DOCTYPE html>
<html>
<head>
    <title>jQuery Task</title>

  
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(document).ready(function(){

            
            $("h1, h2, h3, h4, h5, h6").click(function(){
                $(this).hide();
            });

            
            $(document).mousemove(function(event){
                $("#position").text(
                    "Left: " + event.pageX + " px, Top: " + event.pageY + " px"
                );
            });

        });
    </script>
</head>

<body>

    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>

    

    <div id="position" style="margin-top:20px; font-weight:bold;">
        Mouse Position:
    </div>

</body>
</html>
