<!DOCTYPE html>
<html>
<head>
<title>jQuery Single Element</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function(){

    $("button").click(function(){

        $("p").eq(1).css("color","red");

    });

});
</script>

</head>

<body>

<p>First Paragraph</p>
<p>Second Paragraph</p>
<p>Third Paragraph</p>

<button>Click to change second paragraph</button>

</body>
</html>
